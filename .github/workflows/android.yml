name: Build debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev protobuf-compiler python3-protobuf libopus-dev ffmpeg libavutil-dev libevdev-dev

      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install protobuf for python
        run: |
          pip install protobuf==3.12.4
          python3 -c 'import google.protobuf; print(google.protobuf.__file__)'
          protoc --version

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: chiaki-custom-gamepad-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
